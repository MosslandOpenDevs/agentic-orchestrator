# =============================================================================
# Mossland Agentic Orchestrator - Configuration
# =============================================================================

# Model Configuration
models:
  claude:
    # Primary model for development and planning tasks
    default: opus
    # Fallback if opus is unavailable
    fallback: sonnet

  openai:
    # Primary model for review/evaluation (matches ChatGPT web)
    default: gpt-5.2-chat-latest
    # Fallback model
    fallback: gpt-5.2
    # Pinned version for reproducibility (optional, set to null for latest)
    pinned: null

  gemini:
    # Primary model for fast agentic tasks
    default: gemini-3-flash-preview
    # Fallback models in order of preference
    fallback: gemini-3-pro-preview
    fallback_secondary: gemini-2.5-pro
    # Pinned version for reproducibility (optional)
    pinned: null

# Execution Limits
limits:
  # Maximum planning iterations before escalation/failure
  planning_max_iterations: 3

  # Maximum development iterations before escalation/failure
  dev_max_iterations: 5

  # Rate limit handling
  rate_limit:
    max_retries: 5
    max_wait_seconds: 3600
    initial_backoff_seconds: 10
    backoff_multiplier: 2

  # Loop mode limits
  loop:
    max_steps: 100
    delay_seconds: 10
    lock_timeout_seconds: 300

# LLM Throttling Configuration (Prevents Local LLM Overheating)
throttling:
  # Global settings
  enabled: true
  # Test mode: Less aggressive throttling for faster testing
  test_mode: false

  # Local LLM (Ollama) specific - Production settings
  ollama:
    # Minimum seconds between requests. Enforced per request: a debate round
    # fires its agents with asyncio.gather, and before 2026-08 the interval was
    # computed but the slot was claimed only after sleeping, so every caller in
    # a round woke together and the interval throttled nothing.
    min_request_interval: 5
    # Maximum concurrent requests (1 = sequential only).
    #
    # Also newly enforced: nothing read this value until 2026-08, so despite
    # saying 1 the GPU could be hit by every agent in a round at once. Now that
    # both guards are real, a debate takes longer than it used to -- the change
    # is in wall clock, not in output. If debates start approaching the 90-minute
    # cycle budget, this is the knob: raise it to let a couple of requests
    # overlap, or lower min_request_interval.
    max_concurrent_requests: 1
    # Cooling period after N requests (seconds)
    cooling_period_seconds: 60
    # Number of requests before cooling
    requests_before_cooling: 10
    # Request timeout (seconds) - increased for queued requests +
    # large prompts. Planning prompts on the 14B fallback can hit
    # ~25 min for the slowest agent under concurrency, so 1800s
    # (30 min) gives a meaningful safety margin without making the
    # whole debate-cycle timeout (90 min) trivially reachable from
    # a single hung request.
    request_timeout: 1800
    # Batch delay between multiple generations
    batch_delay_seconds: 10
    # Context window requested on EVERY generate/chat call. Without this
    # option Ollama loads the model at its server default (4096), and long
    # prompts silently truncate output at prompt+output == 4096 with
    # done_reason="length" — trend analysis produced 0 trends for weeks
    # (its prompt alone is ~3,300 tokens). gemma3:4b supports 131k;
    # 16k covers every pipeline prompt while keeping KV-cache cost low.
    num_ctx: 16384

  # Cloud API throttling (cost-conscious limits)
  cloud:
    # Minimum seconds between requests (increased to reduce costs)
    min_request_interval: 3
    # Maximum concurrent requests (reduced)
    max_concurrent_requests: 2
    # Request timeout (seconds)
    request_timeout: 60

# API Budget Configuration
#
# ONE POT, TWO CONSUMERS. This ledger (`api_usage`) is now shared:
#   1. the scheduled paid debate tier (llm.paid_tiers.debate), via the router
#   2. manual `ao` CLI runs (`ao step` / `ao loop` / `ao backlog run`), which
#      were unmetered before the legacy paths were gated — they wrote nothing
#      here, so debates always saw the full budget
# The router reads `can_use_api` from this same ledger, so spend from a manual
# run subtracts from what the debate tier has left, and once the cap is
# crossed the debate SILENTLY degrades to local gemma3:4b for the rest of the
# period (the legacy path gets a loud BudgetExhaustedError; the tier does
# not). Legacy runs default to gpt-5.2-chat-latest at $2.50/$10.00 per M —
# 3.3x the debate model — so they eat the headroom fast. Raise the daily
# limit before doing manual `ao` work on a day that also runs debates.
budget:
  # Daily spending limit in USD. Measured cost of one debate on gpt-5.4-mini
  # is $0.446 (38 calls, 273k in / 54k out — debate context accumulates
  # across rounds, which is why the input side dominates), so 4 debates/day
  # is ~$1.78. At the old $2.00 that left ~$0.21 of headroom, and roughly two
  # legacy completions would cross the cap (see the note above) — which does
  # not fail loudly for the tier, it just puts the rest of the day's debates
  # back on local gemma. $3.00 covers the four debates plus retries and a
  # manual `ao` session on the same day.
  #
  # TWO tiers now draw on this pot, not one. The second-pass promotion
  # reviewer (llm.paid_tiers.review) adds only ~$0.03 per debate — the funnel
  # is narrow — so ~$1.90/day total, still comfortably inside $3.00. But it
  # raises the STAKES of exhausting the cap: the debate tier degrades to local
  # (worse ideas), while the reviewer HOLDS every candidate at `scored` rather
  # than promote it unvetted. Crossing this limit therefore stalls promotion
  # outright, not just quality. Check `/usage` -> `llm_routing` before
  # assuming a quiet pipeline is a quiet day.
  daily_limit_usd: 3.0
  # Monthly spending limit in USD. Must exceed daily x 31 or the month dies
  # before the day does: at $45 the cap bit around day 25 and every later
  # debate degraded to local gemma. $100 still clears the new daily ceiling
  # (31 x $3 = $93) and covers the measured ~$54/month of scheduled debates
  # with room for extra manual ones.
  monthly_limit_usd: 100.0
  # Warn when usage reaches this percentage
  warning_threshold: 0.7
  # Critical alert at this percentage (prefer local models)
  critical_threshold: 0.9

# =============================================================================
# Project Generation Configuration
# =============================================================================
project:
  # Auto-generation settings
  # PAUSED 2026-08-06 while the debate diversity gate is verified: until the
  # clustering gate has run a real debate end to end, a promoted duplicate
  # would scaffold another near-identical project. Re-enable after the
  # golden replay passes and one live debate looks right.
  auto_generate:
    enabled: false
    # Minimum score for automatic project generation
    min_score: 8.0
    # Maximum concurrent project generations
    max_concurrent: 1

  # LLM model selection for different tasks.
  # Consolidated to gemma3:4b: the shared remote Ollama (~8GB GPU) can only keep
  # one generation model resident (plus the qwen3-embedding:0.6b embedder), so a
  # single chat model is used everywhere to avoid VRAM swap stalls.
  llm:
    parsing: "gemma3:4b"
    code_generation: "gemma3:4b"
    architecture: "gemma3:4b"
    fallback: "gemma3:4b"

  # SECURITY KILL SWITCH: generated build/test code must never run on the
  # orchestrator host. Keep this false until a rootless sandbox worker has the
  # digest-pinned image below pre-pulled plus a trusted immutable offline npm
  # cache/lockfile. There is no host npm fallback. Missing runtime/image/cache
  # or any unenforced isolation control produces `ready_with_warnings`.
  #
  # When enabled, build_gate.py enforces network=none, an empty allowlisted
  # process environment, numeric non-root UID, no capabilities,
  # no-new-privileges, read-only root/input, bounded tmpfs, and CPU/memory/PID/
  # file/time limits. npm ci is offline and lifecycle scripts stay off.
  build_gate:
    enabled: false
    install: true
    install_timeout: 300
    step_timeout: 300
    setup_timeout: 60
    total_timeout: 1800
    max_output_chars: 4000
    container_runtime: "docker"
    container_image: "node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32"
    memory: "2g"
    cpus: 1.0
    pids_limit: 128
    workspace_size: "2g"
    tmp_size: "256m"
    max_source_files: 5000
    max_source_bytes: 67108864

  # Output directory
  output_dir: "projects"

# =============================================================================
# Paid-API routing (v0.6.19)
# =============================================================================
# The debate was the one task where local gemma3:4b visibly capped quality
# (score inflation, generic titles) AND the one most exposed to the shared
# GPU's congestion (needs 16k context locally). Everything else (scoring,
# translation, trends, project generation) stays on local Ollama.
#
# TWO switches must both be on before a single cent is spent:
#   1. server .env: MOSS_LOCAL_LLM_ONLY=false  (enables paid providers at all)
#   2. a tier below with enabled: true          (names who may use them)
# Budget limits above still apply — over budget, the tier degrades to local.
llm:
  paid_tiers:
    debate:
      enabled: true
      provider: openai
      model: gpt-5.4-mini   # $0.75/M in, $4.50/M out (2026-08)
    # Second-pass promotion review (v0.6.22). Same model, different job: it
    # sees one idea plus the local scorer's verdict and says confirm/demote/
    # reject. Narrow funnel — only promotion candidates are reviewed, ~3-8
    # per debate, so roughly $0.03 a debate.
    review:
      enabled: true
      provider: openai
      model: gpt-5.4-mini

# =============================================================================
# Backlog Controls (idea de-duplication + GitHub issue cap)
# =============================================================================
backlog:
  # Skip creating an idea whose normalized title prefix already exists, so the
  # same idea is not posted dozens of times (root cause of the 2026 issue flood).
  dedup_enabled: true
  dedup_prefix_tokens: 6
  # Stop posting NEW idea/plan issues to GitHub while this many ideas are OPEN
  # (status scored/pending, i.e. awaiting a triage decision). Ideas are still
  # scored and stored in SQLite (the source of truth); only the GitHub mirror
  # is paused. With triage draining the backlog this is an emergency valve
  # that should never trip. Set to 0 to disable the cap.
  max_open_ideas: 800

  # Idea diversity gate (v0.6.20). A capable debate model given one topic
  # returns one idea many times over, in wordings distinct enough that the
  # title-prefix fingerprint above sees nothing: 2026-08-05 produced 24 ideas
  # of which 8 were the same payment gateway, three of those were each
  # promoted, and each scaffolded a project whose plan document was
  # byte-identical to the others. Ideas are clustered per debate BEFORE
  # scoring (so the LLM is not paid to score copies) and before GitHub (so
  # the tracker mirrors decisions, not noise); only the representative of
  # each cluster proceeds, the rest are stored as linked `duplicate` rows.
  #
  # TUNE ON PRECISION, NEVER ON CLUSTER COUNT. Measured on the 24 golden
  # ideas (tests/data/golden_debate_x402.json): threshold 0.18 is the lowest
  # value reaching pairwise precision 1.00 — 11 clusters, zero cross-theme
  # merges. Lower thresholds do reach the "6-7 themes" the eye expects, but
  # they get there by merging distinct ideas (precision 0.60-0.79), and a
  # merged idea is deleted for good because only the representative
  # proceeds. Precision >= 0.96 holds across 0.16-0.30, so erring high is
  # harmless; erring low destroys ideas.
  # min_shared_terms is the safety rail that makes a mis-set threshold
  # survivable: with it, 24 unrelated ideas stay 24 clusters even at 0.04.
  # Two thresholds, because two different questions are being asked.
  #
  #   threshold (0.18)       "is this the SAME idea?" -> decides who gets
  #                          externalized at all. A wrong merge here DELETES
  #                          an idea: only the representative proceeds. So it
  #                          is precision-first and deliberately under-merges.
  #   theme_threshold (0.12) "is this the same THEME?" -> only limits how
  #                          many siblings may be promoted in one cycle. A
  #                          wrong grouping costs a delayed promotion; the
  #                          idea keeps its row, its issue and its backlog
  #                          place. Recoverable, so it can afford recall.
  #
  # Measured on the live 2026-08-06 batch (16 representatives, every one
  # scored exactly 8.00 by the local scorer): 0.12 yields 9 themes and picks
  # out the groups a human does — four OpenZeppelin/Slither contract
  # scanners together, three TEE attestation services together. 0.08
  # over-merges into a 7-member blob; 0.18 finds almost nothing. Set
  # theme_threshold to 0 to disable theme limiting entirely.
  clustering:
    enabled: true
    threshold: 0.18
    theme_threshold: 0.12
    content_weight: 0.5
    max_df_ratio: 0.6
    min_shared_terms: 2

  # Second-pass promotion review (v0.6.22). The pipeline had an inversion:
  # debates ran on gpt-5.4-mini but the gate deciding whether their output
  # became a plan — and then a scaffolded project — was a local gemma3:4b
  # re-score. The strong model produced the work and the weak one graded it,
  # which is exactly how 2026-08-05 ended with 22 consecutive 8.0s and three
  # near-identical projects.
  #
  # Promotion now needs two signatures. The local scorer still grades every
  # candidate (free, and a fine filter for obvious rejects); only ideas it
  # wants to PROMOTE are sent to the paid reviewer.
  #
  # When the reviewer cannot run — no key, no budget, provider down, tier
  # off — the idea is HELD at `scored`, never promoted. Auto-approval and
  # project generation are downstream of promotion, so a silent reviewer can
  # never let an unvetted idea reach either. A degraded-to-local response is
  # also refused: that is the first opinion twice, not a second one.
  second_pass:
    enabled: true
    paid_tier: review
    min_local_score: 7.0      # only promotion candidates are worth paying for
    # Measured 2026-08-06 on a live debate: 16 representatives all scored
    # exactly 8.00 by the local scorer (zero discrimination), so all 16 were
    # promotion candidates — but the cap of 8 meant half were never reviewed
    # and were held unreviewed. A review costs $0.00049 (8 reviews added
    # $0.0039 to a $0.4459 debate), so covering a whole batch costs under a
    # cent. 20 leaves headroom above the 16 that debate produced.
    max_reviews_per_cycle: 20
    max_tokens: 700

  # Backlog triage — the consumer that matches idea production (~40/day from
  # debates) with terminal decisions. Every backlog cycle (4h in production)
  # re-scores the OLDEST 'scored' ideas against today's trends:
  #   score >= 7 -> promoted + draft plan (human approves via
  #                 POST /plans/{id}/approve); [Idea] issue closes `completed`
  #   score < 4  -> archived; [Idea] issue closes `not_planned` with verdict
  #   middle     -> one strike; archived anyway after max_strikes touches
  # Every idea reaches promoted|archived within max_strikes touches, so the
  # open backlog is bounded by production_rate x days_to_decision instead of
  # growing forever. Sizing: per_run x 6 runs/day must exceed daily idea
  # production (25 x 6 = 150 touches/day >= 75 decisions/day at max_strikes=2,
  # vs ~40 ideas/day produced). Triage writes only to the DB; the issue
  # lifecycle below closes the mirrored issues.
  # Tuned 2026-08-05 (v0.6.17) for a lower open-issue steady state: the
  # original min_age_hours: 24 meant a whole day's ideas sat untouchable —
  # the first live day consumed exactly zero. At 6h an idea still gets a
  # meaningfully different trend context (trends refresh every 2h) but is
  # decided the same day; expected in-flight window ~15-25 open [Idea]
  # issues on top of the human-curated keep-set.
  triage:
    enabled: true
    per_run: 25
    min_age_hours: 6
    max_strikes: 2
    # Circuit breaker: consecutive scorer-unavailable results before the run
    # gives up. A wedged Ollama fails every call identically, and grinding
    # through the quota multiplies one dead backend by per_run while holding
    # moss-ao-backlog "online" for deploy.sh to trip over (2026-08-06).
    max_consecutive_scorer_failures: 3

  # GitHub issue lifecycle (runs in the backlog cycle, every 4h in production).
  # The tracker mirrors the DB pipeline instead of accumulating forever:
  # - [Idea] issues close as `completed` once promoted and their plan exists
  # - [Plan] issues close as `completed` once a project was generated
  # - bot backlog issues with ZERO comments close as `not_planned` after
  #   max_age_days (issues labeled curated:keep or source:trend are never
  #   aged out; any human comment also exempts an issue)
  # Closing is visibility-only: DB rows are untouched, issues can be reopened.
  # max_age_days is the BACKSTOP only — with triage making decision-based
  # closes, the timer mainly catches issues with no DB row behind them
  # (e.g. pre-restore orphans). Tightened 30 -> 14 in v0.6.17.
  issue_lifecycle:
    enabled: true
    max_age_days: 14
    max_closes_per_run: 50

# Debate Configuration
debate:
  # Test mode: Reduced agents for faster testing
  test_mode: false

  # Normal mode settings (when test_mode: false)
  normal:
    divergence_agents_per_round: 8
    convergence_agents_per_round: 4
    # Planning: was 5; lowered to 3 to keep concurrent LLM load below
    # the single-GPU Ollama server's effective parallelism. 5-way
    # concurrent planning blew through request_timeout on 2026-05-01.
    planning_agents_per_round: 3
    divergence_rounds: 3
    convergence_rounds: 2
    planning_rounds: 2

  # Test mode settings (when test_mode: true)
  test:
    divergence_agents_per_round: 2
    convergence_agents_per_round: 2
    planning_agents_per_round: 2
    divergence_rounds: 2
    convergence_rounds: 1
    planning_rounds: 1

# Quality Thresholds
quality:
  # Minimum review score to pass (1-10 scale)
  required_review_score: 7.0

  # Minimum test coverage percentage
  min_test_coverage: 70

  # Required review approvals (from different models)
  min_review_approvals: 1

# Stage Configuration
stages:
  ideation:
    # Number of ideas to generate per run
    ideas_per_run: 3

  planning:
    # Documents to generate
    documents:
      - PRD.md
      - ARCHITECTURE.md
      - TASKS.md
      - ACCEPTANCE_CRITERIA.md

  dev:
    # Auto-commit on each file creation
    auto_commit: true

  qa:
    # Run linting
    run_lint: true
    # Run type checking
    run_typecheck: true
    # Run unit tests
    run_tests: true

# Git Configuration
git:
  # Auto-push after commits
  auto_push: false

  # Branch naming pattern
  branch_pattern: "project/{project_id}"

  # Commit message template
  commit_template: |
    [{stage}] {description}

    {details}

    Generated by: Agentic Orchestrator
    Stage: {stage}
    Project: {project_id}
    Iteration: planning={planning_iter}, dev={dev_iter}

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/orchestrator.log

# =============================================================================
# Trend Analysis Configuration
# =============================================================================
trends:
  # Idea generation mix
  ideas:
    traditional_count: 1  # Mossland-focused ideas
    trend_based_count: 2  # Trend-based ideas

  # Time periods to analyze
  periods:
    - 24h
    - 1w
    - 1m

  # Feed fetching settings
  fetch:
    timeout_seconds: 30
    max_retries: 3
    user_agent: "Agentic-Orchestrator/1.0"

  # Storage settings
  storage:
    directory: data/trends
    retention_days: 90

  # RSS feed sources moved to the top-level `feeds:` section below, which is
  # now the single source of truth shared by trend analysis AND signal
  # collection. `trends.feeds` is still read as a fallback for deployments
  # carrying a locally modified config.yaml, but should be considered removed.

# =============================================================================
# SignalMap export feed (v0.6.24)
# =============================================================================
# The 12th signal adapter, and the only one reading another Mossland service
# rather than a third-party API. SignalMap owns the canonical entity / topic /
# event IDs; AO indexes and consumes them and never mints its own. Contract and
# rationale: docs/signalmap.md.
#
# Endpoint override lives in the environment (SIGNALMAP_BASE_URL), auth token in
# SIGNALMAP_EXPORT_TOKEN — the export is currently open, since it carries only
# what is already public on the site.
signalmap:
  enabled: true
  base_url: "https://signalmap.moss.land"
  path_prefix: "/api/signal/v1"

  # Which record kinds become AO signals. Filtered client-side, not via the
  # API's `kind` parameter: per-kind requests would mean a cursor per kind, and
  # two cursors over one revision ledger is two ways to lose a record.
  kinds:
    - video.summary
    - market.pulse

  # One run's budget. 1000 x 3 = up to 3000 records per signal tick, so the
  # 11,859-record first sync completes in about four ticks instead of pulling
  # 19 MB at once. Server caps limit at 2000.
  page_limit: 1000
  max_pages_per_run: 3

  # The corpus reaches back months and AO's trend window is hours. Older
  # records are still WALKED — the cursor has to pass over them to reach the
  # tail — they are simply not stored.
  max_age_days: 30

  # Records flagged policy.politicalSafety (left/right news channels) ship with
  # evidence.claims empty by design, and re-deriving their positions from
  # title+summary is exactly what that flag forbids. Every AO stage downstream
  # is "hand text to a model and ask what it means", so the rule is enforced by
  # not ingesting them at all. Turning this on makes honoring rule (2) of
  # docs/signalmap.md the caller's problem in every prompt AO writes.
  include_political_safety: false

  # The publisher republishes a few times a day (06:00 / 06:30 KST plus manual
  # deploys); polling harder only buys empty responses. Ignored while the
  # initial backfill is still walking.
  min_interval_minutes: 240

  # daily-ingest runs 06:00 KST. A sourceWatermark that has not moved in over a
  # day means upstream collection stopped — the one failure that no record
  # count can show, because counts stop rising rather than falling.
  watermark_stale_hours: 30

  # Cursor + epoch + watermark. A file, not a table: the scheduler runs each
  # task as a fresh process, and losing this must degrade to "resync from the
  # start" (idempotent, thanks to the publisher's stable record ids) rather
  # than to "silently skip".
  state_file: "data/signalmap_state.json"

# =============================================================================
# RSS Feed Sources (canonical)
# =============================================================================
# SINGLE SOURCE OF TRUTH for every RSS feed the system reads. Consumed by:
#   - signal collection: adapters/rss.py RSSAdapter (via signals/aggregator.py)
#   - trend analysis:    trends/feeds.py FeedFetcher
#
# Before 0.6.11 these two paths used two divergent lists (16 feeds here vs 32
# hardcoded in adapters/rss.py); this section is their merged union. Edit feeds
# here only — no code change or redeploy required.
#
# Per-feed keys: name (required), url (required), enabled (default true).
# The `feeds` value must be a mapping of category -> list of feeds; a flat list
# or scalar is rejected at load time and falls back to the built-in defaults.
# (trends/models.py FeedConfig also parses a `weight` field, but no code reads
#  it today — setting it has no effect.)
feeds:
  # AI / Research / Big Tech
  ai:
    - name: "OpenAI News"
      url: "https://openai.com/news/rss.xml"
    - name: "Google AI"
      url: "https://blog.google/technology/ai/rss/"
    - name: "arXiv AI"
      url: "https://rss.arxiv.org/rss/cs.AI"
    - name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    - name: "Hacker News"
      url: "https://news.ycombinator.com/rss"
    - name: "Hugging Face"
      url: "https://huggingface.co/blog/feed.xml"
    - name: "DeepMind"
      url: "https://www.deepmind.com/blog/rss.xml"
    - name: "BAIR"
      url: "https://bair.berkeley.edu/blog/feed.xml"
    - name: "Lil'Log"
      url: "https://lilianweng.github.io/index.xml"

  # Crypto / Web3
  crypto:
    - name: "CoinDesk"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - name: "Cointelegraph"
      url: "https://cointelegraph.com/rss"
    - name: "Decrypt"
