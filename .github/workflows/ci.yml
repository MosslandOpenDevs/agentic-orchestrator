name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege by default. Nothing here writes to the repository; a job that
# needs more should raise it locally rather than the whole workflow.
permissions:
  contents: read

# Actions below are pinned to commit SHAs rather than moving tags: a tag can be
# repointed at any time by whoever controls the action's repository, and these
# run with access to the checkout. The trailing comment records the tag each
# SHA came from.
env:
  PYTHON_DEFAULT: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The project generator uses PEP 701 f-strings (quote reuse), valid only
        # on Python 3.12+. requires-python is >=3.12 to match.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # A stale lock is its own failure. --frozen installs exactly what
      # uv.lock records and says nothing about whether the lock still matches
      # pyproject.toml -- it exits 0 on a stale one -- so the freshness check
      # has to be explicit.
      - name: Check the lockfile is up to date
        run: uv lock --check

      # --frozen, matching the deploy script exactly. Production installs from
      # the same committed lock, so a green run here and a deploy of that
      # commit mean the same dependency graph; previously each resolved its own
      # from mostly-lower-bound pins.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/agentic_orchestrator --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_DEFAULT }}

      - name: Check formatting
        run: uv run black --check src/ tests/

      - name: Check linting
        run: uv run ruff check src/ tests/

  # The dashboard is half the deployed system and had no CI at all, so a broken
  # build first surfaced on the production server, mid-deploy.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The same command the deploy script runs, against the same lockfile.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `npm test` passes --experimental-strip-types explicitly: Node runs the
      # *.test.ts files directly, and stripping is only on by default from
      # 22.18 / 23.6. The flag is still accepted on newer versions, so this
      # works across every Node the project might be built with.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Production dependencies only: a dev-tool advisory should not block a
      # merge, but a vulnerable package shipped to ao.moss.land should.
      - name: Audit production dependencies
        run: npm audit --omit=dev
